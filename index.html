<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>VIDAA Player - Video.js Test</title>  <link
    href="https://vjs.zencdn.net/8.23.4/video-js.css"
    rel="stylesheet"
  >  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .version {
      position: fixed;
      top: 8px;
      left: 10px;
      font-size: 12px;
      color: #aaa;
      z-index: 9999;
    }

    h1 {
      margin-top: 25px;
      font-size: 22px;
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    #url {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      background: #2d7ff9;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .player-wrap {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .panel {
      margin-top: 15px;
      padding: 15px;
      background: #1b1b1b;
      border-radius: 8px;
    }

    #status {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #bbb;
    }

    #audioTracks {
      margin-top: 10px;
    }

    .track {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      background: #292929;
      border: 1px solid #444;
    }

    .track.active {
      background: #2d7ff9;
    }

    .small {
      color: #888;
      font-size: 12px;
      margin-top: 8px;
    }
  </style></head><body>  <div class="version">VIDAA PLAYER v3.0.0</div>  <div class="player-wrap"><h1>Seedr MKV → Video.js Test</h1>

<div class="url-row">
  <input
    id="url"
    type="text"
    placeholder="Paste your complete Seedr MKV URL here"
    autocomplete="off"
  >

  <button id="loadBtn">LOAD</button>
</div>

<video
  id="player"
  class="video-js vjs-big-play-centered"
  controls
  playsinline
  preload="auto"
  crossorigin="anonymous"
></video>

<div class="panel">
  <strong>Status</strong>
  <div id="status">Waiting for URL...</div>
</div>

<div class="panel">
  <strong>Audio Tracks</strong>
  <div id="audioTracks">
    No tracks detected yet.
  </div>

  <div class="small">
    If the MKV exposes multiple audio streams to the browser,
    they should appear here.
  </div>
</div>

  </div>  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>  <script>
    const urlInput = document.getElementById("url");
    const loadBtn = document.getElementById("loadBtn");
    const status = document.getElementById("status");
    const audioTracksDiv = document.getElementById("audioTracks");

    let player = null;

    function log(message) {
      status.textContent += "\n" + message;
      console.log(message);
    }

    function setStatus(message) {
      status.textContent = message;
      console.log(message);
    }

    function showAudioTracks() {
      audioTracksDiv.innerHTML = "";

      if (!player) {
        audioTracksDiv.textContent = "Player not created.";
        return;
      }

      const tracks = player.audioTracks();

      log("Video.js audioTracks count: " + tracks.length);

      if (!tracks.length) {
        audioTracksDiv.textContent =
          "No audio tracks exposed by Video.js.";
        return;
      }

      for (let i = 0; i < tracks.length; i++) {

        const track = tracks[i];

        const button = document.createElement("button");
        button.className = "track";

        const label =
          track.label ||
          track.language ||
          ("Audio Track " + (i + 1));

        button.textContent =
          (i + 1) + ". " +
          label +
          (track.language ? " [" + track.language + "]" : "");

        if (track.enabled) {
          button.classList.add("active");
        }

        button.onclick = function() {

          for (let j = 0; j < tracks.length; j++) {
            tracks[j].enabled = false;
          }

          track.enabled = true;

          showAudioTracks();

          log("Selected audio track: " + label);
        };

        audioTracksDiv.appendChild(button);
      }
    }

    function createPlayer(url) {

      if (player) {
        try {
          player.dispose();
        } catch (e) {}
      }

      audioTracksDiv.textContent = "Loading...";

      setStatus("Creating Video.js player...");

      player = videojs("player", {
        controls: true,
        preload: "auto",
        fluid: true,
        autoplay: false,
        liveui: false
      });

      player.on("loadstart", function() {
        log("Load started.");
      });

      player.on("loadedmetadata", function() {
        log("Metadata loaded.");
        log("Duration: " + player.duration());

        setTimeout(showAudioTracks, 500);
      });

      player.on("loadeddata", function() {
        log("Video data loaded.");
      });

      player.on("canplay", function() {
        log("Video can play.");
      });

      player.on("play", function() {
        log("Playback started.");
      });

      player.on("error", function() {

        const error = player.error();

        if (error) {
          log(
            "PLAYER ERROR: " +
            error.code +
            " - " +
            error.message
          );
        } else {
          log("PLAYER ERROR: unknown");
        }
      });

      player.on("audioTrackChange", function() {
        log("Audio track changed.");
        showAudioTracks();
      });

      setStatus("Loading Seedr MKV...");

      player.src({
        src: url,
        type: "video/x-matroska"
      });

      player.load();

      log("Source:");
      log(url.split("?")[0]);

      log("Waiting for browser to decode MKV...");
    }

    loadBtn.addEventListener("click", function() {

      const url = urlInput.value.trim();

      if (!url) {
        alert("Paste the complete Seedr MKV URL first.");
        return;
      }

      createPlayer(url);
    });

    urlInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        loadBtn.click();
      }

    });

  </script></body>
</html>
