<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDAA MKV Engine Test</title>

  <script src="https://cdn.jsdelivr.net/npm/web-demuxer@latest/dist/web-demuxer.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #version {
      position: fixed;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,.8);
      padding: 6px 9px;
      z-index: 9999;
      font-size: 13px;
    }

    #app {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0;
      background: #222;
      color: white;
      border: 1px solid #555;
    }

    button {
      padding: 12px 20px;
      margin-top: 5px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div id="version">MKV ENGINE TEST 1.0</div>

<div id="app">

  <h2>MKV Engine Test</h2>

  <p>Paste your temporary Seedr MKV URL below:</p>

  <input
    id="url"
    type="text"
    placeholder="Paste Seedr MKV URL here"
  >

  <button id="test">Test MKV</button>

  <div id="status">Waiting...</div>

</div>

<script>
const status = document.getElementById("status");

function log(message) {
  status.textContent += "\n" + message;
  console.log(message);
}

document.getElementById("test").onclick = async function() {

  const url = document.getElementById("url").value.trim();

  status.textContent = "";

  if (!url) {
    log("❌ No URL entered.");
    return;
  }

  log("Testing Web-Demuxer...");
  log("URL found.");
  log("");

  try {

    if (typeof WebDemuxer === "undefined") {
      throw new Error("WebDemuxer library did not load.");
    }

    log("✅ Web-Demuxer library loaded.");
    log("");

    log("Creating demuxer...");

    const demuxer = new WebDemuxer();

    log("Demuxer created.");
    log("");
    log("Trying to open MKV...");

    await demuxer.load(url);

    log("✅ MKV opened successfully!");
    log("");

    log("Trying to read media information...");

    const info = await demuxer.getMediaInfo();

    console.log("MEDIA INFO:", info);

    log(JSON.stringify(info, null, 2));

  } catch (error) {

    console.error(error);

    log("");
    log("❌ TEST FAILED");
    log(error.toString());

  }

};
</script>

</body>
</html>
