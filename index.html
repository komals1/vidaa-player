<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seedr Fetch Test</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        padding: 20px;
    }

    textarea {
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        font-size: 14px;
        margin-bottom: 10px;
    }

    button {
        font-size: 18px;
        padding: 12px 20px;
        margin-bottom: 15px;
    }

    #result {
        white-space: pre-wrap;
        background: #222;
        padding: 15px;
        border-radius: 8px;
    }
</style>
</head>

<body>

<h2>Seedr → JavaScript Fetch Test</h2>

<textarea id="url" placeholder="Paste your Seedr direct URL here"></textarea>

<br>

<button onclick="testFetch()">TEST FETCH</button>

<div id="result">Waiting...</div>

<script>

async function testFetch() {

    const url = document.getElementById("url").value.trim();
    const result = document.getElementById("result");

    if (!url) {
        result.textContent = "❌ Please paste the Seedr URL.";
        return;
    }

    result.textContent =
        "⏳ Testing JavaScript access to the Seedr file...\n\n" +
        "This may take a few seconds.";

    try {

        const response = await fetch(url, {
            method: "GET",
            mode: "cors"
        });

        result.textContent =
            "✅ FETCH SUCCEEDED!\n\n" +
            "Status: " + response.status + "\n" +
            "Response type: " + response.type + "\n" +
            "Content-Type: " + response.headers.get("content-type") + "\n" +
            "Content-Length: " + response.headers.get("content-length") + "\n\n" +
            "🎉 This is VERY promising.\n" +
            "JavaScript can access the Seedr file.";

    } catch (error) {

        result.textContent =
            "❌ FETCH FAILED\n\n" +
            "Error:\n" +
            error.message +
            "\n\n" +
            "This probably means Seedr does not allow CORS access.";
    }
}

</script>

</body>
</html>
