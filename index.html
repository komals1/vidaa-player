<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vidaa Player (MKV/MP4)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #3b82f6;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      height: 100%;
    }
    .version {
      position: fixed;
      top: 8px;
      left: 10px;
      font-size: 12px;
      color: var(--muted);
      z-index: 9999;
      background: rgba(0,0,0,0.35);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 10px 40px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    input[type="url"], input[type="text"] {
      flex: 1 1 320px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #2a3441;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    input::placeholder {
      color: #6b7785;
    }
    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #2a3441;
      background: #1f2937;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    button.primary {
      background: var(--accent);
      border-color: #2563eb;
    }
    .player-wrapper {
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      margin-top: 10px;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
      padding: 10px 12px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    select {
      background: #0f141b;
      color: var(--text);
      border: 1px solid #2a3441;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      min-width: 140px;
    }
    .note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .error {
      margin-top: 8px;
      font-size: 13px;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="version">Version 1.1.0</div>

  <div class="container">
    <h1>Seedr MKV/MP4 Player</h1>

    <div class="input-row">
      <input id="streamUrl" type="url" placeholder="Paste your Seedr .mkv or .mp4 URL here" />
      <button id="loadBtn" class="primary">Load Stream</button>
    </div>

    <div class="player-wrapper">
      <video id="video" controls playsinline></video>
      <div class="controls">
        <div class="control-group">
          <label for="audioSelect">Audio</label>
          <select id="audioSelect">
            <option value="-1">Default</option>
          </select>
        </div>
        <div class="control-group">
          <label for="subSelect">Subtitles</label>
          <select id="subSelect">
            <option value="-1">Off</option>
          </select>
        </div>
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="note">
      This player tries to play direct MKV/MP4 URLs in the browser. Multi‑audio and subtitle support depend on what your browser exposes. For reliable multi‑audio switching, HLS (like Seedr V2) is required. [45][50][53]
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const streamUrlInput = document.getElementById('streamUrl');
    const loadBtn = document.getElementById('loadBtn');
    const audioSelect = document.getElementById('audioSelect');
    const subSelect = document.getElementById('subSelect');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.textContent = msg || '';
    }

    function populateAudioTracks() {
      audioSelect.innerHTML = '';
      const defaultOption = document.createElement('option');
      defaultOption.value = '-1';
      defaultOption.textContent = 'Default';
      audioSelect.appendChild(defaultOption);

      const tracks = video.audioTracks || [];
      if (!tracks.length) {
        audioSelect.disabled = true;
        return;
      }

      audioSelect.disabled = false;
      for (let i = 0; i < tracks.length; i++) {
        const track = tracks[i];
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = (track.label || track.language || ('Track ' + (i + 1)));
        if (track.enabled) {
          opt.selected = true;
          audioSelect.value = String(i);
        }
        audioSelect.appendChild(opt);
      }
    }

    function populateSubtitleTracks() {
      subSelect.innerHTML = '';
      const offOption = document.createElement('option');
      offOption.value = '-1';
      offOption.textContent = 'Off';
      subSelect.appendChild(offOption);

      const tracks = video.textTracks || [];
      if (!tracks.length) {
        subSelect.disabled = true;
        return;
      }

      subSelect.disabled = false;
      for (let i = 0; i < tracks.length; i++) {
        const track = tracks[i];
        const opt = document.createElement('option');
        opt.value = String(i);
        const labelParts = [];
        if (track.label) labelParts.push(track.label);
        if (track.language) labelParts.push('(' + track.language + ')');
        if (track.kind) labelParts.push('[' + track.kind + ']');
        opt.textContent = labelParts.join(' ') || ('Subtitle ' + (i + 1));
        if (track.mode === 'showing') {
          opt.selected = true;
          subSelect.value = String(i);
        }
        subSelect.appendChild(opt);
      }
    }

    function updateTrackMenusOnceLoaded() {
      // Wait until metadata is loaded so tracks are available
      if (video.readyState >= 1) {
        populateAudioTracks();
        populateSubtitleTracks();
      }
    }

    function loadStream(url) {
      showError('');
      if (!url) {
        showError('Please paste a valid .mkv or .mp4 URL.');
        return;
      }

      // Reset
      video.pause();
      video.src = '';
      video.load();
      audioSelect.innerHTML = '<option value="-1">Default</option>';
      subSelect.innerHTML = '<option value="-1">Off</option>';
      audioSelect.disabled = true;
      subSelect.disabled = true;

      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        updateTrackMenusOnceLoaded();
        video.play().catch(() => {});
      }, { once: true });

      video.addEventListener('error', () => {
        const err = video.error;
        if (err) {
          let msg = 'Playback error: ';
          if (err.code === 4) msg += 'format not supported';
          else if (err.code === 1) msg += 'aborted';
          else if (err.code === 2) msg += 'network';
          else if (err.code === 3) msg += 'decode';
          else msg += 'unknown';
          showError(msg);
        }
      });
    }

    loadBtn.addEventListener('click', () => {
      const url = streamUrlInput.value.trim();
      loadStream(url);
    });

    streamUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = streamUrlInput.value.trim();
        loadStream(url);
      }
    });

    audioSelect.addEventListener('change', () => {
      const tracks = video.audioTracks;
      if (!tracks || !tracks.length) return;
      const idx = parseInt(audioSelect.value, 10);
      if (!Number.isFinite(idx) || idx < 0) return;

      for (let i = 0; i < tracks.length; i++) {
        tracks[i].enabled = (i === idx);
      }
    });

    subSelect.addEventListener('change', () => {
      const tracks = video.textTracks;
      if (!tracks || !tracks.length) return;
      const idx = parseInt(subSelect.value, 10);

      for (let i = 0; i < tracks.length; i++) {
        tracks[i].mode = (i === idx) ? 'showing' : 'hidden';
      }
    });
  </script>
</body>
</html>
