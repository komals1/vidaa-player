<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDAA Player Test</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #version {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 9999;
      background: rgba(0,0,0,.7);
      padding: 5px 8px;
      font-size: 13px;
    }

    #app {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
    }

    video {
      width: 100%;
      background: black;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #222;
      white-space: pre-wrap;
    }

    button {
      margin: 10px 5px 0 0;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="version">TEST VERSION 1.0</div>

<div id="app">

  <h2>HLS Player Test</h2>

  <video id="video" controls></video>

  <div id="tracks"></div>

  <div id="status">Waiting...</div>

</div>

<script>
const video = document.getElementById("video");
const tracksDiv = document.getElementById("tracks");
const status = document.getElementById("status");

let hls;

function log(text) {
  status.textContent += "\n" + text;
  console.log(text);
}

/*
  IMPORTANT:
  We will paste the Seedr HLS master URL here
  AFTER the page is ready.
*/
const streamUrl = "";

if (Hls.isSupported()) {

  log("hls.js is supported.");

  hls = new Hls();

  hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {

    log("MANIFEST_PARSED");
    log("Video levels: " + data.levels.length);
    log("Audio tracks: " + hls.audioTracks.length);

    tracksDiv.innerHTML = "<h3>Audio Tracks</h3>";

    hls.audioTracks.forEach((track, index) => {

      const button = document.createElement("button");

      button.textContent =
        (track.name || "Track " + index) +
        " [" + (track.lang || "unknown") + "]";

      button.onclick = function() {

        log("Switching to audio track " + index);

        hls.audioTrack = index;
      };

      tracksDiv.appendChild(button);
    });
  });

  hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, function(event, data) {
    log("Audio switched to track ID: " + data.id);
  });

  hls.on(Hls.Events.ERROR, function(event, data) {
    console.log("HLS ERROR:", data);
    log("HLS ERROR: " + data.type + " / " + data.details);
  });

  if (streamUrl) {
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else {
    log("No stream URL yet.");
  }

} else if (video.canPlayType("application/vnd.apple.mpegurl")) {

  log("Native HLS supported.");

} else {

  log("HLS is NOT supported.");
}
</script>

</body>
</html>
