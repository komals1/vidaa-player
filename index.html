<script>
  const video = document.getElementById('video');
  const streamUrlInput = document.getElementById('streamUrl');
  const loadBtn = document.getElementById('loadBtn');
  const audioSelect = document.getElementById('audioSelect');
  const subSelect = document.getElementById('subSelect');
  const errorBox = document.getElementById('errorBox');

  // ==========================================
  // DEFAULT MOVIE URL
  // ==========================================
  const DEFAULT_STREAM_URL = 'https://rd17.seedr.cc/ff_get/2862141/5993945990/www.5MovieRulz.company%20-%20I,%20Nobody%20(2026)%20Malayalam%20HQ%20HDRip%20-%201080p%20-%20x264%20-%20(DD_5.1%20-%20192Kbps%20_%20AAC)%20-%202.9GB%20-%20ESub.mkv?st=fPE5cNBJZLv0ObnHdoWVCQ&e=1789871427';

  function showError(msg) {
    errorBox.textContent = msg || '';
  }

  // ... keep all your existing functions here ...

  loadBtn.addEventListener('click', () => {
    const url = streamUrlInput.value.trim();
    loadStream(url);
  });

  streamUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const url = streamUrlInput.value.trim();
      loadStream(url);
    }
  });

  audioSelect.addEventListener('change', () => {
    const tracks = video.audioTracks;
    if (!tracks || !tracks.length) return;

    const idx = parseInt(audioSelect.value, 10);
    if (!Number.isFinite(idx) || idx < 0) return;

    for (let i = 0; i < tracks.length; i++) {
      tracks[i].enabled = (i === idx);
    }
  });

  subSelect.addEventListener('change', () => {
    const tracks = video.textTracks;
    if (!tracks || !tracks.length) return;

    const idx = parseInt(subSelect.value, 10);

    for (let i = 0; i < tracks.length; i++) {
      tracks[i].mode = (i === idx) ? 'showing' : 'hidden';
    }
  });

  // ==========================================
  // AUTO LOAD DEFAULT URL
  // ==========================================
  window.addEventListener('DOMContentLoaded', () => {
    if (DEFAULT_STREAM_URL) {
      streamUrlInput.value = DEFAULT_STREAM_URL;
      loadStream(DEFAULT_STREAM_URL);
    }
  });
</script>
