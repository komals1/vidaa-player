<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIDAA Player Diagnostic</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        background: #101010;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        font-size: 32px;
    }

    input {
        width: 90%;
        max-width: 1000px;
        padding: 15px;
        font-size: 18px;
        box-sizing: border-box;
        background: #222;
        color: white;
        border: 1px solid #555;
    }

    button {
        padding: 14px 22px;
        margin: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    video {
        display: block;
        width: 95%;
        max-width: 1100px;
        margin: 25px auto;
        background: black;
    }

    #status {
        margin: 20px;
        padding: 15px;
        background: #222;
        font-size: 20px;
    }

    #diagnostics {
        margin: 20px auto;
        padding: 20px;
        max-width: 1000px;
        background: #181818;
        text-align: left;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .audioButton {
        padding: 15px 25px;
        margin: 6px;
    }
</style>
</head>

<body>

<h1>VIDAA Player Diagnostic</h1>

<input
    id="url"
    type="text"
    placeholder="Paste your Seedr video URL here"
>

<br>

<button onclick="startVideo()">▶ PLAY VIDEO</button>

<div id="status">
    Waiting for video...
</div>

<video
    id="video"
    controls
    playsinline>
</video>

<h2>Audio Test</h2>

<div id="audioControls">
    Waiting for video...
</div>

<h2>VIDAA Diagnostic Information</h2>

<div id="diagnostics">
Waiting...
</div>


<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const diagnostics = document.getElementById("diagnostics");
const audioControls = document.getElementById("audioControls");


function startVideo() {

    const url = document.getElementById("url").value.trim();

    if (!url) {
        statusBox.innerText = "Please enter a video URL.";
        return;
    }

    statusBox.innerText = "Loading video...";

    video.src = url;
    video.load();

    runDiagnostics();

    video.play().catch(function() {
        statusBox.innerText =
            "Video loaded. Press PLAY.";
    });
}


function runDiagnostics() {

    let result = "";

    result += "Browser: " +
        navigator.userAgent + "\n\n";

    result += "VIDEO ELEMENT\n";
    result += "--------------\n";

    result += "video.audioTracks exists: " +
        ("audioTracks" in video) + "\n";

    result += "audioTracks value: " +
        (video.audioTracks ? "available" : "not available") + "\n";

    result += "audioTracks count: ";

    if (video.audioTracks) {
        result += video.audioTracks.length;
    } else {
        result += "N/A";
    }

    result += "\n\n";


    result += "MEDIA CAPABILITIES\n";
    result += "------------------\n";

    result += "MediaSource available: " +
        ("MediaSource" in window) + "\n";

    result += "canPlayType MP4: " +
        video.canPlayType("video/mp4") + "\n";

    result += "canPlayType MKV: " +
        video.canPlayType("video/x-matroska") + "\n";

    result += "canPlayType WebM: " +
        video.canPlayType("video/webm") + "\n";

    result += "\n";


    result += "VIDEO INFORMATION\n";
    result += "-----------------\n";

    result += "Ready state: " +
        video.readyState + "\n";

    result += "Network state: " +
        video.networkState + "\n";

    result += "Duration: " +
        (isNaN(video.duration)
            ? "not available yet"
            : video.duration) + "\n";

    result += "\n";


    result += "OTHER TRACK APIs\n";
    result += "----------------\n";

    result += "textTracks exists: " +
        ("textTracks" in video) + "\n";

    result += "videoTracks exists: " +
        ("videoTracks" in video) + "\n";


    diagnostics.innerText = result;

    checkAudioTracks();
}


function checkAudioTracks() {

    audioControls.innerHTML = "";

    if (!video.audioTracks) {

        audioControls.innerHTML =
            "<p>❌ JavaScript audioTracks API is not available.</p>" +
            "<p>We will investigate another method.</p>";

        return;
    }


    const count = video.audioTracks.length;

    if (count === 0) {

        audioControls.innerHTML =
            "<p>⚠️ API exists, but no audio tracks are exposed.</p>";

        return;
    }


    audioControls.innerHTML =
        "<p>✅ " + count +
        " audio track(s) detected.</p>";


    for (let i = 0; i < count; i++) {

        const track = video.audioTracks[i];

        const button =
            document.createElement("button");

        button.className = "audioButton";

        button.innerText =
            "Audio " + (i + 1) +
            (track.label
                ? " — " + track.label
                : "");


        button.onclick = function() {

            for (let j = 0;
                 j < video.audioTracks.length;
                 j++) {

                video.audioTracks[j].enabled = false;
            }

            track.enabled = true;

            statusBox.innerText =
                "Selected Audio " + (i + 1);
        };


        audioControls.appendChild(button);
    }
}


/* Update diagnostics when video metadata becomes available */

video.addEventListener("loadedmetadata", function() {

    statusBox.innerText =
        "Video metadata loaded.";

    runDiagnostics();

});


video.addEventListener("canplay", function() {

    statusBox.innerText =
        "Video can play.";

    runDiagnostics();

});


video.addEventListener("error", function() {

    let message = "Video error.";

    if (video.error) {

        message +=
            " Error code: " +
            video.error.code;

    }

    statusBox.innerText = message;

    runDiagnostics();

});

</script>

</body>
</html>
